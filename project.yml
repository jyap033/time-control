name: TimeControl

# ─────────────────────────────────────────────────────────────────────────────
# TimeControl — an Opal-style time-management app.
#
# THIS IS THE FREE-TIER BUILD. It signs on a free "Personal Team" because it has
# NO Family Controls entitlement, NO App Group, and NO app extensions — the parts
# Apple only allows on a paid Developer account.
#
# It keeps: focus timer, guilt notifications, Shortcuts "open app -> intervention"
# flow, and stats. It does NOT block apps in-app (that needs the paid tier).
#
# The full blocking build still lives in the repo behind the FREE_TIER flag — see
# README "Upgrading to the full blocking build" to turn it back on after enrolling
# in the Apple Developer Program.
#
# Regenerate the .xcodeproj on your Mac:   xcodegen generate   (or ./bootstrap.sh)
#
# CHANGE THESE before building:
#   1. DEVELOPMENT_TEAM -> leave blank and pick your team in Xcode's UI, OR set it.
#   2. PRODUCT_BUNDLE_IDENTIFIER -> must be unique to your Apple ID.
# ─────────────────────────────────────────────────────────────────────────────

options:
  bundleIdPrefix: com.jyap
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # Leave blank to pick your team in Xcode (Signing & Capabilities), or set the
    # 10-character Team ID here.
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"   # iPhone
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:

  TimeControl:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Shared
    settings:
      base:
        # Must be unique to your Apple ID. Change if signing says it's taken.
        PRODUCT_BUNDLE_IDENTIFIER: com.jyap.timecontrol
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Compiles out all Family Controls / ManagedSettings / DeviceActivity
        # BEHAVIOR is still linked, but the FREE_TIER flag hides the auth gate and
        # the blocking-only UI so the app is coherent without the entitlement.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: FREE_TIER
